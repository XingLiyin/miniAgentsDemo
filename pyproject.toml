[project]
name = "ipmaster-cowork"
version = "0.1.0"
description = "Agent 后端服务（Task/Session/Memory 调度与 LLM 工具链）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "uvicorn>=0.42.0",
    "cairosvg>=2.9.0",
    "mcp>=1.27.1",
    "setuptools>=70.0.0",
    "truststore>=0.10.0",
    "pyopenssl>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
