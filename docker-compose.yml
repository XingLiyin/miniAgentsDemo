services:
  netlive-cowork:
    image: netlive-cowork:latest
    container_name: netlive-cowork
    restart: unless-stopped
    ports:
      - "15926:15926"
    env_file:
      - .env
    volumes:
      - ./data:/netlive-cowork/data
      - ./resources:/netlive-cowork/resources
      - ./logs:/netlive-cowork/logs
