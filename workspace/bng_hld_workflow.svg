<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750">
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6B7280"/>
    </marker>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 10 0, 5 7" fill="#F59E0B"/>
    </marker>
    <!-- 阴影 -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
    <filter id="shadowGreen" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#10B98133"/>
    </filter>
    <!-- 渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1000" height="750" rx="12" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- ==================== 顶部标题 ==================== -->
  <rect x="150" y="18" width="700" height="52" rx="26" fill="#1E3A5F" filter="url(#shadow)"/>
  <text x="500" y="51" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="22" font-weight="bold">BNG 设备搬迁配置建议方案 — 工作流程图</text>

  <!-- ==================== 左侧区域：输入数据 ==================== -->
  <rect x="30" y="95" width="260" height="370" rx="10" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="30" y="95" width="260" height="36" rx="10" fill="#3B82F6"/>
  <rect x="30" y="121" width="260" height="10" fill="#3B82F6"/>
  <text x="160" y="118" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="15" font-weight="bold">📥 输入数据</text>

  <!-- 文件 1 -->
  <rect x="52" y="150" width="216" height="80" rx="8" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadowLight)"/>
  <!-- 文件图标 -->
  <rect x="68" y="162" width="22" height="28" rx="3" fill="#3B82F6" opacity="0.8"/>
  <rect x="68" y="162" width="22" height="4" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <line x1="74" y1="174" x2="84" y2="174" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="74" y1="179" x2="82" y2="179" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <text x="102" y="178" fill="#1E3A5F" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="13" font-weight="bold">原单板业务统计表</text>
  <text x="102" y="196" fill="#6B7280" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">旧机房单板配置情况</text>
  <text x="160" y="220" text-anchor="middle" fill="#9CA3AF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="10">原单板业务统计表.xlsx</text>

  <!-- 文件 2 -->
  <rect x="52" y="248" width="216" height="80" rx="8" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadowLight)"/>
  <rect x="68" y="260" width="22" height="28" rx="3" fill="#3B82F6" opacity="0.8"/>
  <rect x="68" y="260" width="22" height="4" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <line x1="74" y1="272" x2="84" y2="272" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="74" y1="277" x2="82" y2="277" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <text x="102" y="276" fill="#1E3A5F" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="13" font-weight="bold">端口规划表</text>
  <text x="102" y="294" fill="#6B7280" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">新站点端口配置计划</text>
  <text x="160" y="318" text-anchor="middle" fill="#9CA3AF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="10">端口规划表.xlsx</text>

  <!-- 文件 3 -->
  <rect x="52" y="346" width="216" height="80" rx="8" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="1.5" filter="url(#shadowLight)"/>
  <rect x="68" y="358" width="22" height="28" rx="3" fill="#3B82F6" opacity="0.8"/>
  <rect x="68" y="358" width="22" height="4" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <line x1="74" y1="370" x2="84" y2="370" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="74" y1="375" x2="82" y2="375" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <text x="102" y="374" fill="#1E3A5F" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="13" font-weight="bold">EOX/集采对照表</text>
  <text x="102" y="392" fill="#6B7280" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">设备生命周期及集采替换</text>
  <text x="160" y="416" text-anchor="middle" fill="#9CA3AF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="10">EOX/集采对照表.xlsx</text>

  <!-- ==================== 箭头：输入 → 处理 ==================== -->
  <line x1="290" y1="280" x2="340" y2="280" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- ==================== 中间区域：处理逻辑 ==================== -->
  <rect x="345" y="95" width="310" height="370" rx="10" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="345" y="95" width="310" height="36" rx="10" fill="#F59E0B"/>
  <rect x="345" y="121" width="310" height="10" fill="#F59E0B"/>
  <text x="500" y="118" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="15" font-weight="bold">⚙️ 处理逻辑</text>

  <!-- 处理框 1 -->
  <rect x="365" y="150" width="270" height="80" rx="8" fill="url(#orangeGrad)" stroke="#FBBF24" stroke-width="1.5" filter="url(#shadowLight)"/>
  <circle cx="390" cy="178" r="16" fill="#F59E0B"/>
  <text x="390" y="183" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold">1</text>
  <text x="414" y="175" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold">剔除未使用槽位</text>
  <text x="414" y="196" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">清理不再需要的槽位配置，</text>
  <text x="414" y="214" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">精简设备结构</text>

  <!-- 向下箭头 -->
  <line x1="500" y1="230" x2="500" y2="262" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- 处理框 2 -->
  <rect x="365" y="266" width="270" height="80" rx="8" fill="url(#orangeGrad)" stroke="#FBBF24" stroke-width="1.5" filter="url(#shadowLight)"/>
  <circle cx="390" cy="294" r="16" fill="#F59E0B"/>
  <text x="390" y="299" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold">2</text>
  <text x="414" y="291" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold">EOX 单板识别与替换</text>
  <text x="414" y="312" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">识别已停产（EOX）单板，</text>
  <text x="414" y="330" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">按规则 1:1 替换为新型号</text>

  <!-- 向下箭头 -->
  <line x1="500" y1="346" x2="500" y2="378" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrowDown)"/>

  <!-- 处理框 3 -->
  <rect x="365" y="382" width="270" height="80" rx="8" fill="url(#orangeGrad)" stroke="#FBBF24" stroke-width="1.5" filter="url(#shadowLight)"/>
  <circle cx="390" cy="410" r="16" fill="#F59E0B"/>
  <text x="390" y="415" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold">3</text>
  <text x="414" y="407" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold">合并优化单板布局</text>
  <text x="414" y="428" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">根据设计原则优化单板</text>
  <text x="414" y="446" fill="#92400E" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">数量和布局</text>

  <!-- ==================== 箭头：处理 → 输出 ==================== -->
  <line x1="655" y1="280" x2="705" y2="280" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- ==================== 右侧区域：输出结果 ==================== -->
  <rect x="710" y="95" width="260" height="370" rx="10" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3"/>
  <rect x="710" y="95" width="260" height="36" rx="10" fill="#10B981"/>
  <rect x="710" y="121" width="260" height="10" fill="#10B981"/>
  <text x="840" y="118" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="15" font-weight="bold">📄 输出结果</text>

  <!-- 输出大框 -->
  <rect x="735" y="160" width="210" height="200" rx="12" fill="url(#greenGrad)" stroke="#34D399" stroke-width="2.5" filter="url(#shadowGreen)"/>

  <!-- 文档图标 -->
  <rect x="805" y="185" width="50" height="60" rx="4" fill="#10B981" opacity="0.85"/>
  <rect x="805" y="185" width="50" height="8" rx="2" fill="#FFFFFF" opacity="0.7"/>
  <line x1="815" y1="203" x2="845" y2="203" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <line x1="815" y1="212" x2="840" y2="212" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
  <line x1="815" y1="221" x2="835" y2="221" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>

  <text x="840" y="270" text-anchor="middle" fill="#065F46" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="16" font-weight="bold">BNG HLD</text>
  <text x="840" y="292" text-anchor="middle" fill="#065F46" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="16" font-weight="bold">配置建议表</text>
  <text x="840" y="318" text-anchor="middle" fill="#6B7280" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">新机房部署用</text>

  <!-- 输出区域下方的提示条 -->
  <rect x="735" y="380" width="210" height="36" rx="18" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="840" y="403" text-anchor="middle" fill="#065F46" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="12">✅ 可直接用于 B 机房部署</text>

  <!-- ==================== 底部：核心设计原则 ==================== -->
  <rect x="50" y="495" width="900" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="495" width="900" height="36" rx="12" fill="#1E3A5F"/>
  <rect x="50" y="519" width="900" height="12" fill="#1E3A5F"/>
  <text x="500" y="518" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="15" font-weight="bold">📋 核心设计原则</text>

  <!-- 原则 1 -->
  <rect x="80" y="548" width="260" height="56" rx="8" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.2"/>
  <circle cx="100" cy="562" r="10" fill="#3B82F6"/>
  <text x="100" y="567" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11" font-weight="bold">①</text>
  <text x="120" y="566" fill="#1E3A5F" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="12" font-weight="bold">剔除未使用槽位</text>
  <text x="120" y="586" fill="#64748B" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">精简配置，避免资源浪费</text>

  <!-- 原则 2 -->
  <rect x="370" y="548" width="260" height="56" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
  <circle cx="390" cy="562" r="10" fill="#F59E0B"/>
  <text x="390" y="567" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11" font-weight="bold">②</text>
  <text x="410" y="566" fill="#1E3A5F" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="12" font-weight="bold">EOX 单板 1:1 替换</text>
  <text x="410" y="586" fill="#64748B" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">集采新型号替代停产板卡</text>

  <!-- 原则 3 -->
  <rect x="660" y="548" width="260" height="56" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="680" cy="562" r="10" fill="#10B981"/>
  <text x="680" y="567" text-anchor="middle" fill="#FFFFFF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11" font-weight="bold">③</text>
  <text x="700" y="566" fill="#1E3A5F" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="12" font-weight="bold">遵循移动集采框架</text>
  <text x="700" y="586" fill="#64748B" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11">统一新机房单板型号</text>

  <!-- ==================== 页脚 ==================== -->
  <text x="500" y="648" text-anchor="middle" fill="#9CA3AF" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="10">注：本流程适用于华为 BNG 设备由 A 机房（旧机房）搬迁至 B 机房（新机房）的场景，新机房统一采用移动集采框架单板。</text>

  <!-- 装饰性底部线条 -->
  <line x1="200" y1="668" x2="800" y2="668" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="500" cy="668" r="3" fill="#CBD5E1"/>

</svg>