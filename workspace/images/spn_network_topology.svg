<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750">
  <title>SPN网络拓扑示意图</title>
  <defs>
    <!-- 3D立方体设备图标（橙黄色PTN/SPN设备样式） -->
    <g id="device-cube">
      <!-- 顶面 -->
      <polygon points="-24,-15 0,-28 24,-15 0,-2" fill="#F5A623" stroke="#C77D1F" stroke-width="1.5"/>
      <!-- 正面 -->
      <polygon points="-24,-15 0,-2 0,22 -24,9" fill="#E8912A" stroke="#C77D1F" stroke-width="1.5"/>
      <!-- 右面 -->
      <polygon points="0,-2 24,-15 24,9 0,22" fill="#D4821F" stroke="#C77D1F" stroke-width="1.5"/>
      <!-- 端口细节 -->
      <rect x="-12" y="0" width="4" height="3" rx="0.5" fill="#6B4A1A" opacity="0.6"/>
      <rect x="-6" y="0" width="4" height="3" rx="0.5" fill="#6B4A1A" opacity="0.6"/>
      <rect x="6" y="-10" width="4" height="3" rx="0.5" fill="#6B4A1A" opacity="0.6"/>
      <rect x="12" y="-10" width="4" height="3" rx="0.5" fill="#6B4A1A" opacity="0.6"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="750" fill="#F7F9FC"/>

  <!-- 背景装饰网格 -->
  <g stroke="#E8EDF2" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="450" y1="0" x2="450" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="750" y1="0" x2="750" y2="750"/>
  </g>

  <!-- ======== 连线（先画在底层） ======== -->

  <!-- SPN汇聚环 - 四边形：A(左上)-B(右上)-D(中右)-C(中左) -->
  <line x1="200" y1="200" x2="700" y2="200" stroke="#2B6CB0" stroke-width="3"/>
  <line x1="200" y1="200" x2="300" y2="400" stroke="#2B6CB0" stroke-width="3"/>
  <line x1="700" y1="200" x2="600" y2="400" stroke="#2B6CB0" stroke-width="3"/>
  <line x1="300" y1="400" x2="600" y2="400" stroke="#2B6CB0" stroke-width="3"/>

  <!-- SPN接入环 - 三角形：C(中左)-E(底部)-D(中右) -->
  <line x1="300" y1="400" x2="450" y2="600" stroke="#38A169" stroke-width="3"/>
  <line x1="600" y1="400" x2="450" y2="600" stroke="#38A169" stroke-width="3"/>

  <!-- ======== 环标注文字 ======== -->

  <!-- SPN汇聚环 标注（中上偏右） -->
  <rect x="530" y="240" width="150" height="40" rx="20" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="605" y="266" text-anchor="middle" fill="#2B6CB0" font-size="16" font-family="Arial, sans-serif" font-weight="bold">SPN汇聚环</text>

  <!-- SPN接入环 标注（中部偏右） -->
  <rect x="530" y="470" width="150" height="40" rx="20" fill="#F0FFF4" stroke="#38A169" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="605" y="496" text-anchor="middle" fill="#38A169" font-size="16" font-family="Arial, sans-serif" font-weight="bold">SPN接入环</text>

  <!-- ======== FlexE 100G 链路标注 ======== -->

  <!-- A-B（汇聚环上边水平线） -->
  <rect x="395" y="178" width="92" height="20" rx="10" fill="#2B6CB0"/>
  <text x="441" y="193" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="Arial, sans-serif" font-weight="bold">FlexE 100G</text>

  <!-- A-C（汇聚环左边斜线） -->
  <rect x="215" y="278" width="92" height="20" rx="10" fill="#2B6CB0"/>
  <text x="261" y="293" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="Arial, sans-serif" font-weight="bold">FlexE 100G</text>

  <!-- B-D（汇聚环右边斜线） -->
  <rect x="620" y="278" width="92" height="20" rx="10" fill="#2B6CB0"/>
  <text x="666" y="293" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="Arial, sans-serif" font-weight="bold">FlexE 100G</text>

  <!-- C-D（汇聚环底边水平线，同时也是接入环上边） -->
  <rect x="385" y="378" width="92" height="20" rx="10" fill="#2B6CB0"/>
  <text x="431" y="393" text-anchor="middle" fill="#FFFFFF" font-size="11" font-family="Arial, sans-serif" font-weight="bold">FlexE 100G</text>

  <!-- ======== 虚线框 - 新垦机房（包裹节点C） ======== -->
  <g>
    <rect x="190" y="320" width="220" height="180" rx="8" fill="rgba(212,130,31,0.05)" stroke="#D4821F" stroke-width="2.5" stroke-dasharray="6,4"/>
    <!-- 框顶标签 -->
    <rect x="200" y="308" width="96" height="24" rx="4" fill="#D4821F"/>
    <text x="248" y="325" text-anchor="middle" fill="#FFFFFF" font-size="13" font-family="Arial, sans-serif" font-weight="bold">新垦机房</text>
  </g>

  <!-- ======== 节点设备 ======== -->

  <!-- 节点A：P1410（左上） -->
  <g transform="translate(200, 200)">
    <use href="#device-cube"/>
    <rect x="-34" y="-42" width="72" height="24" rx="4" fill="#FFF3E0" stroke="#E8912A" stroke-width="1"/>
    <text x="2" y="-25" text-anchor="middle" fill="#C77D1F" font-size="14" font-family="Arial, sans-serif" font-weight="bold">P1410</text>
  </g>

  <!-- 节点B：匿名节点（右上） -->
  <g transform="translate(700, 200)">
    <use href="#device-cube"/>
  </g>

  <!-- 节点C：P1543（中左 - 新垦机房内） -->
  <g transform="translate(300, 400)">
    <use href="#device-cube"/>
    <rect x="-34" y="30" width="72" height="24" rx="4" fill="#FFF3E0" stroke="#E8912A" stroke-width="1"/>
    <text x="2" y="47" text-anchor="middle" fill="#C77D1F" font-size="14" font-family="Arial, sans-serif" font-weight="bold">P1543</text>
  </g>

  <!-- 节点D：P1621（中右） -->
  <g transform="translate(600, 400)">
    <use href="#device-cube"/>
    <rect x="-34" y="30" width="72" height="24" rx="4" fill="#FFF3E0" stroke="#E8912A" stroke-width="1"/>
    <text x="2" y="47" text-anchor="middle" fill="#C77D1F" font-size="14" font-family="Arial, sans-serif" font-weight="bold">P1621</text>
  </g>

  <!-- 节点E：匿名节点（底部中央） -->
  <g transform="translate(450, 600)">
    <use href="#device-cube"/>
  </g>

  <!-- ======== 图例 ======== -->
  <g transform="translate(30, 680)">
    <text x="0" y="0" fill="#4A5568" font-size="14" font-family="Arial, sans-serif" font-weight="bold">图例：</text>
    
    <!-- 汇聚环 -->
    <line x1="60" y1="-5" x2="110" y2="-5" stroke="#2B6CB0" stroke-width="3"/>
    <text x="120" y="-1" fill="#4A5568" font-size="12" font-family="Arial, sans-serif">SPN汇聚环 (FlexE 100G)</text>
    
    <!-- 接入环 -->
    <line x1="330" y1="-5" x2="380" y2="-5" stroke="#38A169" stroke-width="3"/>
    <text x="390" y="-1" fill="#4A5568" font-size="12" font-family="Arial, sans-serif">SPN接入环</text>
    
    <!-- 设备图标 -->
    <g transform="translate(58, 16) scale(0.45)">
      <polygon points="-24,-15 0,-28 24,-15 0,-2" fill="#F5A623" stroke="#C77D1F" stroke-width="1.5"/>
      <polygon points="-24,-15 0,-2 0,22 -24,9" fill="#E8912A" stroke="#C77D1F" stroke-width="1.5"/>
      <polygon points="0,-2 24,-15 24,9 0,22" fill="#D4821F" stroke="#C77D1F" stroke-width="1.5"/>
    </g>
    <text x="80" y="21" fill="#4A5568" font-size="12" font-family="Arial, sans-serif">SPN设备 (PTN/SPN)</text>
  </g>
</svg>