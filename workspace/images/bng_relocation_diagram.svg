<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800">
  <title>BNG机房搬迁方案图</title>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#2980b9"/>
    </marker>
    <!-- Gradient for device circles -->
    <radialGradient id="blueGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#5dade2"/>
      <stop offset="100%" stop-color="#21618c"/>
    </radialGradient>
    <radialGradient id="cyanGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#76d7c4"/>
      <stop offset="100%" stop-color="#1abc9c"/>
    </radialGradient>
    <radialGradient id="grayGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#bdc3c7"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">BNG机房搬迁方案图</text>

  <!-- ========== Station boundary boxes ========== -->
  <!-- 新垦旧站 (left) -->
  <rect x="40" y="190" width="280" height="340" rx="12" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="180" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" font-family="Arial, sans-serif">新垦旧站</text>

  <!-- 新垦新站 (right) -->
  <rect x="780" y="190" width="280" height="340" rx="12" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="920" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" font-family="Arial, sans-serif">新垦新站</text>

  <!-- CR Layer container -->
  <ellipse cx="550" cy="110" rx="220" ry="52" fill="#d4effc" stroke="#85c1e9" stroke-width="2"/>
  <text x="550" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#2980b9" font-family="Arial, sans-serif">CR Layer</text>

  <!-- ========== LAYER 1: OSS, Internet, CR1, CR2 ========== -->

  <!-- OSS -->
  <g filter="url(#shadow)">
    <circle cx="80" cy="90" r="28" fill="url(#grayGrad)"/>
    <!-- Person icon simplified -->
    <circle cx="80" cy="82" r="6" fill="white"/>
    <path d="M68 98 Q80 88 92 98" fill="white"/>
    <!-- Server icon -->
    <rect x="68" y="100" width="24" height="14" rx="2" fill="white" opacity="0.9"/>
    <line x1="74" y1="105" x2="86" y2="105" stroke="#7f8c8d" stroke-width="1.5"/>
    <line x1="74" y1="109" x2="86" y2="109" stroke="#7f8c8d" stroke-width="1.5"/>
  </g>
  <text x="80" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" font-family="Arial, sans-serif">OSS</text>

  <!-- Internet -->
  <ellipse cx="550" cy="75" rx="80" ry="28" fill="#e67e22" filter="url(#shadow)"/>
  <text x="550" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="white" font-family="Arial, sans-serif">Internet</text>

  <!-- Internet → CR1 -->
  <line x1="520" y1="98" x2="465" y2="128" stroke="#333" stroke-width="2"/>
  <!-- Internet → CR2 -->
  <line x1="580" y1="98" x2="635" y2="128" stroke="#333" stroke-width="2"/>

  <!-- CR1 -->
  <g filter="url(#shadow)">
    <circle cx="445" cy="145" r="28" fill="url(#blueGrad)"/>
    <text x="445" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif">R</text>
  </g>
  <text x="445" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">CR1</text>

  <!-- CR2 -->
  <g filter="url(#shadow)">
    <circle cx="655" cy="145" r="28" fill="url(#blueGrad)"/>
    <text x="655" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif">R</text>
  </g>
  <text x="655" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">CR2</text>

  <!-- CR1 — CR2 horizontal interconnect -->
  <line x1="475" y1="145" x2="625" y2="145" stroke="#333" stroke-width="2.5"/>

  <!-- ========== LAYER 2: BNG devices ========== -->

  <!-- BNG新垦旧站 -->
  <g filter="url(#shadow)">
    <circle cx="180" cy="270" r="32" fill="url(#blueGrad)"/>
    <text x="180" y="276" text-anchor="middle" font-size="18" font-weight="bold" fill="white" font-family="Arial, sans-serif">M</text>
  </g>
  <text x="180" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">BNG(ME60)</text>
  <text x="180" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">新垦旧站</text>

  <!-- BNG南沙2机房 -->
  <g filter="url(#shadow)">
    <circle cx="550" cy="270" r="32" fill="url(#blueGrad)"/>
    <text x="542" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif">S</text>
    <text x="558" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial, sans-serif">M</text>
  </g>
  <text x="550" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">BNG(ME60)</text>
  <text x="550" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">南沙2机房</text>

  <!-- BNG新垦新站 -->
  <g filter="url(#shadow)">
    <circle cx="920" cy="270" r="32" fill="url(#blueGrad)"/>
    <text x="920" y="276" text-anchor="middle" font-size="18" font-weight="bold" fill="white" font-family="Arial, sans-serif">M</text>
  </g>
  <text x="920" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">BNG(ME60)</text>
  <text x="920" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">新垦新站</text>

  <!-- ========== CR to BNG connections ========== -->
  <!-- CR1 → BNG新垦旧站 -->
  <line x1="425" y1="165" x2="210" y2="250" stroke="#333" stroke-width="2"/>
  <!-- CR1 → BNG南沙2机房 -->
  <line x1="445" y1="173" x2="530" y2="242" stroke="#333" stroke-width="2"/>
  <!-- CR2 → BNG南沙2机房 -->
  <line x1="655" y1="173" x2="570" y2="242" stroke="#333" stroke-width="2"/>
  <!-- CR2 → BNG新垦新站 -->
  <line x1="675" y1="165" x2="890" y2="250" stroke="#333" stroke-width="2"/>

  <!-- ========== LAYER 3: OLT devices ========== -->

  <!-- OLT_001 -->
  <g filter="url(#shadow)">
    <rect x="120" y="420" width="120" height="70" rx="6" fill="url(#blueGrad)"/>
    <!-- Switch icon lines -->
    <line x1="135" y1="440" x2="225" y2="440" stroke="white" stroke-width="2"/>
    <line x1="135" y1="455" x2="225" y2="455" stroke="white" stroke-width="2"/>
    <circle cx="145" cy="440" r="3" fill="white"/>
    <circle cx="165" cy="440" r="3" fill="white"/>
    <circle cx="185" cy="440" r="3" fill="white"/>
    <circle cx="205" cy="440" r="3" fill="white"/>
    <circle cx="145" cy="455" r="3" fill="white"/>
    <circle cx="165" cy="455" r="3" fill="white"/>
    <circle cx="185" cy="455" r="3" fill="white"/>
    <circle cx="205" cy="455" r="3" fill="white"/>
  </g>
  <text x="180" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">OLT_001</text>

  <!-- Uplink port labels -->
  <text x="145" y="415" text-anchor="middle" font-size="9" fill="#555" font-family="Arial, sans-serif">上行0/10/0</text>
  <text x="215" y="415" text-anchor="middle" font-size="9" fill="#555" font-family="Arial, sans-serif">上行0/9/0</text>

  <!-- 鱼窝头大道节点 -->
  <g filter="url(#shadow)">
    <polygon points="550,415 530,450 570,450" fill="url(#blueGrad)"/>
  </g>
  <text x="550" y="475" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">至鱼窝头大道</text>

  <!-- OLT_001_NEW -->
  <g filter="url(#shadow)">
    <rect x="860" y="420" width="120" height="70" rx="6" fill="url(#blueGrad)"/>
    <line x1="875" y1="440" x2="965" y2="440" stroke="white" stroke-width="2"/>
    <line x1="875" y1="455" x2="965" y2="455" stroke="white" stroke-width="2"/>
    <circle cx="885" cy="440" r="3" fill="white"/>
    <circle cx="905" cy="440" r="3" fill="white"/>
    <circle cx="925" cy="440" r="3" fill="white"/>
    <circle cx="945" cy="440" r="3" fill="white"/>
    <circle cx="885" cy="455" r="3" fill="white"/>
    <circle cx="905" cy="455" r="3" fill="white"/>
    <circle cx="925" cy="455" r="3" fill="white"/>
    <circle cx="945" cy="455" r="3" fill="white"/>
  </g>
  <text x="920" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">OLT_001_NEW</text>

  <!-- Uplink port labels for NEW -->
  <text x="885" y="415" text-anchor="middle" font-size="9" fill="#555" font-family="Arial, sans-serif">上行0/9/0</text>
  <text x="955" y="415" text-anchor="middle" font-size="9" fill="#555" font-family="Arial, sans-serif">上行0/10/0</text>

  <!-- ========== BNG to OLT connections (old) ========== -->
  <!-- BNG新垦旧站 → OLT_001 (uplink 0/10/0 left) -->
  <line x1="170" y1="302" x2="150" y2="418" stroke="#333" stroke-width="2"/>
  <!-- BNG新垦旧站 → OLT_001 (uplink 0/9/0 right) -->
  <line x1="190" y1="302" x2="210" y2="418" stroke="#333" stroke-width="2"/>

  <!-- ========== Red X marks on abolished links ========== -->
  <!-- X on 0/10/0 link -->
  <g transform="translate(155, 355)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#e74c3c" stroke-width="3"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#e74c3c" stroke-width="3"/>
  </g>
  <!-- X on 0/9/0 link -->
  <g transform="translate(200, 355)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#e74c3c" stroke-width="3"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#e74c3c" stroke-width="3"/>
  </g>

  <!-- ========== OLT_001 → 鱼窝头大道 (abolished) ========== -->
  <line x1="240" y1="455" x2="528" y2="440" stroke="#333" stroke-width="2"/>
  <g transform="translate(380, 450)">
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#e74c3c" stroke-width="3"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#e74c3c" stroke-width="3"/>
  </g>

  <!-- ========== BNG新垦旧站 → BNG新垦新站 (red slash, cutover) ========== -->
  <line x1="212" y1="270" x2="888" y2="270" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="550" y="258" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold" font-family="Arial, sans-serif">割接迁移</text>

  <!-- ========== Red dashed lines with step numbers ========== -->
  <!-- ① BNG新垦旧站 → BNG南沙2机房 -->
  <line x1="212" y1="290" x2="518" y2="290" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="365" cy="282" r="14" fill="#e74c3c"/>
  <text x="365" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="Arial, sans-serif">①</text>

  <!-- ② BNG南沙2机房 → BNG新垦新站 -->
  <line x1="582" y1="290" x2="888" y2="290" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="735" cy="282" r="14" fill="#e74c3c"/>
  <text x="735" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="Arial, sans-serif">②</text>

  <!-- ③ OLT_001_NEW 上行0/9/0 → BNG新垦新站 -->
  <path d="M885 420 Q860 350 900 305" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <circle cx="870" cy="355" r="14" fill="#e74c3c"/>
  <text x="870" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="Arial, sans-serif">③</text>

  <!-- ④ OLT_001_NEW 上行0/10/0 → BNG新垦新站 -->
  <path d="M955 420 Q970 350 940 305" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <circle cx="970" cy="355" r="14" fill="#e74c3c"/>
  <text x="970" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="Arial, sans-serif">④</text>

  <!-- ========== Blue thick arrows (cutover direction) ========== -->
  <polygon points="400,298 430,290 400,282 410,290" fill="#2980b9"/>
  <polygon points="610,302 640,294 610,286 620,294" fill="#2980b9"/>

  <!-- ========== LAYER 4: Bottom devices ========== -->

  <!-- 鱼窝头大道节点 → 光分路器 -->
  <line x1="550" y1="452" x2="550" y2="580" stroke="#333" stroke-width="2"/>

  <!-- 光分路器 -->
  <g filter="url(#shadow)">
    <polygon points="550,575 530,610 570,610" fill="url(#blueGrad)"/>
  </g>
  <text x="550" y="628" text-anchor="middle" font-size="10" fill="#555" font-family="Arial, sans-serif">光分路器</text>

  <!-- 光分路器 → ONT家庭组网 -->
  <line x1="535" y1="610" x2="420" y2="670" stroke="#333" stroke-width="1.5"/>

  <!-- 光分路器 → MDU政企用户 -->
  <line x1="565" y1="610" x2="680" y2="670" stroke="#333" stroke-width="1.5"/>

  <!-- ONT家庭组网 -->
  <g filter="url(#shadow)">
    <rect x="370" y="675" width="100" height="50" rx="6" fill="url(#cyanGrad)"/>
    <text x="420" y="700" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="Arial, sans-serif">ONT</text>
    <text x="420" y="716" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">家庭组网</text>
  </g>

  <!-- MDU政企用户 -->
  <g filter="url(#shadow)">
    <rect x="630" y="675" width="100" height="50" rx="6" fill="url(#cyanGrad)"/>
    <text x="680" y="700" text-anchor="middle" font-size="13" font-weight="bold" fill="white" font-family="Arial, sans-serif">MDU</text>
    <text x="680" y="716" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">政企用户</text>
  </g>

  <!-- ========== LEGEND ========== -->
  <g transform="translate(800, 600)">
    <rect x="0" y="0" width="260" height="160" rx="8" fill="white" stroke="#ccc" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="130" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">图例</text>

    <!-- 废除链路 -->
    <line x1="20" y1="45" x2="80" y2="45" stroke="#e74c3c" stroke-width="2.5"/>
    <g transform="translate(50, 45)">
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#e74c3c" stroke-width="2.5"/>
      <line x1="6" y1="-6" x2="-6" y2="6" stroke="#e74c3c" stroke-width="2.5"/>
    </g>
    <text x="95" y="49" font-size="11" fill="#333" font-family="Arial, sans-serif">废除链路</text>

    <!-- 新建路径 -->
    <line x1="20" y1="75" x2="80" y2="75" stroke="#e74c3c" stroke-width="2.5" stroke-dasharray="6,4"/>
    <circle cx="50" cy="67" r="8" fill="#e74c3c"/>
    <text x="50" y="70" text-anchor="middle" font-size="8" font-weight="bold" fill="white" font-family="Arial, sans-serif">①</text>
    <text x="95" y="79" font-size="11" fill="#333" font-family="Arial, sans-serif">新建路径</text>

    <!-- 割接方向 -->
    <polygon points="20,105 70,97 20,89 35,97" fill="#2980b9"/>
    <text x="95" y="101" font-size="11" fill="#333" font-family="Arial, sans-serif">割接方向</text>

    <!-- 站点边界 -->
    <rect x="15" y="112" width="30" height="20" rx="3" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="95" y="126" font-size="11" fill="#333" font-family="Arial, sans-serif">站点边界</text>

    <!-- CR层容器 -->
    <ellipse cx="35" cy="148" rx="25" ry="10" fill="#d4effc" stroke="#85c1e9" stroke-width="1.5"/>
    <text x="95" y="152" font-size="11" fill="#333" font-family="Arial, sans-serif">CR层容器</text>
  </g>

</svg>
