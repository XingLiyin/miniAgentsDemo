<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>通用流程图</title>
  <style>
    .process { fill: #4CAF50; stroke: #2E7D32; stroke-width: 2; }
    .decision { fill: #2196F3; stroke: #1565C0; stroke-width: 2; }
    .start-end { fill: #FF9800; stroke: #E65100; stroke-width: 2; }
    .text { font-family: Arial, sans-serif; font-size: 16px; fill: white; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Start node -->
  <ellipse cx="400" cy="80" rx="60" ry="30" class="start-end" />
  <text x="400" y="80" class="text">开始</text>

  <!-- Process node -->
  <rect x="350" y="160" width="100" height="60" rx="5" ry="5" class="process" />
  <text x="400" y="190" class="text">处理数据</text>

  <!-- Decision node -->
  <polygon points="400,300 450,350 400,400 350,350" class="decision" />
  <text x="400" y="350" class="text">条件判断</text>

  <!-- End nodes -->
  <ellipse cx="250" cy="500" rx="60" ry="30" class="start-end" />
  <text x="250" y="500" class="text">结束（否）</text>

  <ellipse cx="550" cy="500" rx="60" ry="30" class="start-end" />
  <text x="550" y="500" class="text">结束（是）</text>

  <!-- Arrows -->
  <line x1="400" y1="110" x2="400" y2="160" class="arrow" />
  <line x1="400" y1="220" x2="400" y2="300" class="arrow" />
  <line x1="350" y1="350" x2="250" y2="470" class="arrow" />
  <line x1="450" y1="350" x2="550" y2="470" class="arrow" />

  <!-- Labels on arrows -->
  <text x="410" y="135" class="label">执行</text>
  <text x="410" y="260" class="label">评估</text>
  <text x="290" y="410" class="label">否</text>
  <text x="510" y="410" class="label">是</text>
</svg>