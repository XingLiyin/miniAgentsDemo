<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>SPN网络拓扑示意图</title>
  <defs>
    <!-- 节点渐变 -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="nodeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <!-- 节点图标 -->
    <g id="router-node">
      <!-- 底座 -->
      <rect x="-28" y="-22" width="56" height="44" rx="8" ry="8" fill="url(#nodeGrad)" stroke="url(#nodeBorderGrad)" stroke-width="2.5" filter="url(#shadow)"/>
      <!-- 高光 -->
      <rect x="-24" y="-18" width="48" height="12" rx="5" ry="5" fill="#FFF" opacity="0.3"/>
      <!-- 面板 -->
      <rect x="-22" y="-6" width="44" height="20" rx="4" ry="4" fill="#FFF3E0" opacity="0.4"/>
      <!-- 端口 -->
      <circle cx="-12" cy="4" r="3.5" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
      <circle cx="0" cy="4" r="3.5" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
      <circle cx="12" cy="4" r="3.5" fill="#FFF8E1" stroke="#FFA726" stroke-width="1"/>
      <!-- 端口灯 -->
      <circle cx="-12" cy="4" r="1.8" fill="#4CAF50"/>
      <circle cx="0" cy="4" r="1.8" fill="#4CAF50"/>
      <circle cx="12" cy="4" r="1.8" fill="#FF9800"/>
      <!-- 底部槽位 -->
      <rect x="-20" y="14" width="40" height="4" rx="2" ry="2" fill="#FFCC80" opacity="0.6"/>
    </g>
    <!-- 匿名节点图标（稍小） -->
    <g id="router-node-anon">
      <rect x="-22" y="-18" width="44" height="36" rx="7" ry="7" fill="url(#nodeGrad)" stroke="url(#nodeBorderGrad)" stroke-width="2" filter="url(#shadow)"/>
      <rect x="-19" y="-14" width="38" height="10" rx="4" ry="4" fill="#FFF" opacity="0.25"/>
      <rect x="-17" y="-5" width="34" height="16" rx="3" ry="3" fill="#FFF3E0" opacity="0.35"/>
      <circle cx="-9" cy="3" r="3" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
      <circle cx="0" cy="3" r="3" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>
      <circle cx="9" cy="3" r="3" fill="#FFF8E1" stroke="#FFA726" stroke-width="1"/>
      <circle cx="-9" cy="3" r="1.5" fill="#4CAF50"/>
      <circle cx="0" cy="3" r="1.5" fill="#4CAF50"/>
      <circle cx="9" cy="3" r="1.5" fill="#FF9800"/>
      <rect x="-16" y="11" width="32" height="3" rx="1.5" ry="1.5" fill="#FFCC80" opacity="0.5"/>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="#ECEFF1"/>
  
  <!-- 装饰网格 -->
  <g opacity="0.06" stroke="#546E7A" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="525" x2="800" y2="525"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- ===== 连线层（在节点下方） ===== -->
  
  <!-- SPN汇聚环：四边形 A-B-D-C-A -->
  <g stroke="#1565C0" stroke-width="4" fill="none" stroke-linejoin="round">
    <!-- A(200,130) ↔ B(600,130) 顶部水平 -->
    <line x1="200" y1="130" x2="600" y2="130"/>
    <!-- B(600,130) ↔ D(550,300) 右下斜线 -->
    <line x1="600" y1="130" x2="550" y2="300"/>
    <!-- D(550,300) ↔ C(250,300) 底部水平 -->
    <line x1="550" y1="300" x2="250" y2="300"/>
    <!-- C(250,300) ↔ A(200,130) 左上斜线 -->
    <line x1="250" y1="300" x2="200" y2="130"/>
  </g>

  <!-- SPN接入环：三角形 C-D-E -->
  <g stroke="#00897B" stroke-width="3" fill="none" stroke-linejoin="round">
    <!-- C(250,300) ↔ E(400,480) -->
    <line x1="250" y1="300" x2="400" y2="480"/>
    <!-- D(550,300) ↔ E(400,480) -->
    <line x1="550" y1="300" x2="400" y2="480"/>
  </g>

  <!-- ===== 虚线框：新垦机房（框住节点C） ===== -->
  <rect x="170" y="255" width="160" height="100" rx="10" ry="10" fill="#FFF8E1" fill-opacity="0.6" stroke="#EF6C00" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="250" y="348" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#BF360C">新垦机房</text>

  <!-- ===== 节点层 ===== -->
  
  <!-- 节点A：左上 P1410 -->
  <g transform="translate(200, 130)">
    <use href="#router-node"/>
  </g>
  <text x="200" y="88" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="bold" fill="#212121">P1410</text>

  <!-- 节点B：右上 匿名 -->
  <g transform="translate(600, 130)">
    <use href="#router-node-anon"/>
  </g>

  <!-- 节点C：中左 P1543 (被虚线框框住) -->
  <g transform="translate(250, 300)">
    <use href="#router-node"/>
  </g>
  <text x="250" y="380" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="bold" fill="#212121">P1543</text>

  <!-- 节点D：中右 P1621 -->
  <g transform="translate(550, 300)">
    <use href="#router-node"/>
  </g>
  <text x="550" y="380" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="17" font-weight="bold" fill="#212121">P1621</text>

  <!-- 节点E：底部 匿名 -->
  <g transform="translate(400, 480)">
    <use href="#router-node-anon"/>
  </g>

  <!-- ===== 环标注 ===== -->
  <!-- SPN汇聚环标注 -->
  <rect x="340" y="178" width="120" height="30" rx="15" ry="15" fill="#1565C0" opacity="0.9" filter="url(#shadowSmall)"/>
  <text x="400" y="199" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">SPN汇聚环</text>

  <!-- SPN接入环标注 -->
  <rect x="420" y="378" width="120" height="30" rx="15" ry="15" fill="#00897B" opacity="0.9" filter="url(#shadowSmall)"/>
  <text x="480" y="399" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">SPN接入环</text>

  <!-- ===== 图例 ===== -->
  <g transform="translate(620, 520)">
    <rect x="-10" y="-18" width="160" height="60" rx="8" ry="8" fill="#FFFFFF" opacity="0.85" filter="url(#shadowSmall)"/>
    <text x="0" y="0" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="12" font-weight="bold" fill="#424242">图例</text>
    <line x1="0" y1="14" x2="35" y2="14" stroke="#1565C0" stroke-width="4"/>
    <text x="45" y="18" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#616161">汇聚环</text>
    <line x1="0" y1="30" x2="35" y2="30" stroke="#00897B" stroke-width="3"/>
    <text x="45" y="34" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#616161">接入环</text>
  </g>

  <!-- 标题 -->
  <text x="400" y="42" text-anchor="middle" font-family="'Microsoft YaHei', 'SimHei', 'PingFang SC', Arial, sans-serif" font-size="22" font-weight="bold" fill="#263238">SPN 网络拓扑示意图</text>
</svg>