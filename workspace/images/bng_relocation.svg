<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<title>BNG机房搬迁方案图</title>
<defs>
  <!-- Arrowhead marker for blue thick arrows -->
  <marker id="blueArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
    <path d="M0,1 L12,5 L0,9 Z" fill="#2196F3"/>
  </marker>
  <!-- Arrowhead for black lines -->
  <marker id="blackArrow" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
  </marker>
</defs>

<style>
  .title { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
  .label { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  .label-white { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 13px; fill: #fff; text-anchor: middle; font-weight: bold; }
  .label-small { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 10px; fill: #555; text-anchor: middle; }
  .oss-label { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 13px; fill: #555; text-anchor: middle; font-weight: bold; }
  .step-circle { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 12px; fill: #fff; text-anchor: middle; font-weight: bold; }
  .legend-title { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: start; font-weight: bold; }
  .legend-text { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 11px; fill: #555; text-anchor: start; }
  .box-title { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 14px; fill: #1a1a2e; text-anchor: middle; font-weight: bold; }
  .port-label { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 9px; fill: #666; text-anchor: middle; }
  .ont-label { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 11px; fill: #00796B; text-anchor: middle; font-weight: bold; }
  .mdu-label { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; font-size: 11px; fill: #00796B; text-anchor: middle; font-weight: bold; }
</style>

<!-- ==================== 背景 ==================== -->
<rect width="1200" height="900" fill="#f8f9fa"/>

<!-- ==================== 标题 ==================== -->
<text x="600" y="32" class="title">BNG机房搬迁方案图</text>

<!-- ==================== 站点边界虚线框 ==================== -->
<!-- 新垦旧站 (左侧) -->
<rect x="80" y="200" width="320" height="420" rx="8" ry="8" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="8,4"/>
<rect x="120" y="190" width="140" height="24" rx="4" ry="4" fill="#f8f9fa"/>
<text x="190" y="207" class="box-title">新垦旧站</text>

<!-- 新垦新站 (右侧) -->
<rect x="800" y="200" width="320" height="420" rx="8" ry="8" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="8,4"/>
<rect x="840" y="190" width="140" height="24" rx="4" ry="4" fill="#f8f9fa"/>
<text x="910" y="207" class="box-title">新垦新站</text>

<!-- ==================== 第一层：OSS, Internet, CR ==================== -->
<!-- OSS - 左上角 -->
<g transform="translate(60, 75)">
  <!-- 人形图标 -->
  <circle cx="0" cy="-15" r="8" fill="#888"/>
  <path d="M-10,-3 C-10,5 10,5 10,-3" fill="none" stroke="#888" stroke-width="3"/>
  <line x1="0" y1="5" x2="0" y2="20" stroke="#888" stroke-width="2.5"/>
  <line x1="-8" y1="20" x2="8" y2="20" stroke="#888" stroke-width="2.5"/>
  <!-- 服务器图标 -->
  <rect x="-18" y="24" width="36" height="16" rx="2" fill="#777" stroke="#666" stroke-width="1"/>
  <rect x="-15" y="27" width="8" height="3" rx="1" fill="#aaa"/>
  <rect x="-5" y="27" width="8" height="3" rx="1" fill="#aaa"/>
  <rect x="-15" y="32" width="8" height="3" rx="1" fill="#aaa"/>
  <rect x="-5" y="32" width="8" height="3" rx="1" fill="#aaa"/>
  <text x="0" y="58" class="oss-label">OSS</text>
</g>

<!-- Internet - 顶部中央 -->
<ellipse cx="500" cy="65" rx="100" ry="28" fill="#FF9800" stroke="#E65100" stroke-width="2"/>
<text x="500" y="70" class="label-white" font-size="16">Internet</text>

<!-- CR层容器 - 浅蓝色椭圆 -->
<ellipse cx="500" cy="140" rx="180" ry="45" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5"/>

<!-- CR1 -->
<g transform="translate(400, 140)">
  <circle cx="0" cy="0" r="28" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <!-- 路由器图标 -->
  <circle cx="0" cy="-4" r="4" fill="#fff"/>
  <line x1="-8" y1="6" x2="8" y2="6" stroke="#fff" stroke-width="2"/>
  <line x1="-6" y1="6" x2="-6" y2="12" stroke="#fff" stroke-width="1.5"/>
  <line x1="0" y1="6" x2="0" y2="12" stroke="#fff" stroke-width="1.5"/>
  <line x1="6" y1="6" x2="6" y2="12" stroke="#fff" stroke-width="1.5"/>
  <text x="0" y="48" class="label" font-weight="bold">CR1</text>
</g>

<!-- CR2 -->
<g transform="translate(600, 140)">
  <circle cx="0" cy="0" r="28" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <circle cx="0" cy="-4" r="4" fill="#fff"/>
  <line x1="-8" y1="6" x2="8" y2="6" stroke="#fff" stroke-width="2"/>
  <line x1="-6" y1="6" x2="-6" y2="12" stroke="#fff" stroke-width="1.5"/>
  <line x1="0" y1="6" x2="0" y2="12" stroke="#fff" stroke-width="1.5"/>
  <line x1="6" y1="6" x2="6" y2="12" stroke="#fff" stroke-width="1.5"/>
  <text x="0" y="48" class="label" font-weight="bold">CR2</text>
</g>

<!-- ==================== 第二层：BNG ==================== -->
<!-- BNG 新垦旧站 -->
<g transform="translate(240, 310)">
  <circle cx="0" cy="0" r="32" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="0" y="6" class="label-white" font-size="18">M</text>
  <text x="0" y="52" class="label" font-weight="bold" font-size="11">BNG(ME60)</text>
  <text x="0" y="65" class="label" font-size="10">新垦旧站</text>
</g>

<!-- BNG 南沙2机房 -->
<g transform="translate(600, 310)">
  <circle cx="0" cy="0" r="32" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="-6" y="-2" class="label-white" font-size="13">S</text>
  <text x="8" y="12" class="label-white" font-size="11">M</text>
  <text x="0" y="52" class="label" font-weight="bold" font-size="11">BNG(ME60)</text>
  <text x="0" y="65" class="label" font-size="10">南沙2机房</text>
</g>

<!-- BNG 新垦新站 -->
<g transform="translate(960, 310)">
  <circle cx="0" cy="0" r="32" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="0" y="6" class="label-white" font-size="18">M</text>
  <text x="0" y="52" class="label" font-weight="bold" font-size="11">BNG(ME60)</text>
  <text x="0" y="65" class="label" font-size="10">新垦新站</text>
</g>

<!-- ==================== 第三层：OLT ==================== -->
<!-- OLT_001 -->
<g transform="translate(240, 490)">
  <rect x="-28" y="-24" width="56" height="48" rx="4" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <!-- 交换机图标 -->
  <rect x="-20" y="-16" width="40" height="20" rx="2" fill="#1565C0" stroke="#fff" stroke-width="1"/>
  <circle cx="-10" cy="-6" r="3" fill="#4FC3F7"/>
  <circle cx="0" cy="-6" r="3" fill="#4FC3F7"/>
  <circle cx="10" cy="-6" r="3" fill="#4FC3F7"/>
  <rect x="-20" y="6" width="40" height="6" rx="1" fill="#1565C0"/>
  <!-- 端口标签 -->
  <text x="-20" y="-30" class="port-label">上行0/10/0</text>
  <text x="20" y="-30" class="port-label">上行0/9/0</text>
  <!-- 端口连线点 -->
  <line x1="-20" y1="-24" x2="-20" y2="-32" stroke="#555" stroke-width="1.5"/>
  <line x1="20" y1="-24" x2="20" y2="-32" stroke="#555" stroke-width="1.5"/>
  <text x="0" y="42" class="label" font-weight="bold">OLT_001</text>
</g>

<!-- 鱼窝头大道节点 -->
<g transform="translate(600, 500)">
  <polygon points="0,-18 -18,12 18,12" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="0" y="34" class="label" font-weight="bold" font-size="10">至鱼窝头</text>
  <text x="0" y="46" class="label" font-size="10">大道节点</text>
</g>

<!-- OLT_001_NEW -->
<g transform="translate(960, 490)">
  <rect x="-28" y="-24" width="56" height="48" rx="4" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <rect x="-20" y="-16" width="40" height="20" rx="2" fill="#1565C0" stroke="#fff" stroke-width="1"/>
  <circle cx="-10" cy="-6" r="3" fill="#4FC3F7"/>
  <circle cx="0" cy="-6" r="3" fill="#4FC3F7"/>
  <circle cx="10" cy="-6" r="3" fill="#4FC3F7"/>
  <rect x="-20" y="6" width="40" height="6" rx="1" fill="#1565C0"/>
  <text x="-20" y="-30" class="port-label">上行0/9/0</text>
  <text x="20" y="-30" class="port-label">上行0/10/0</text>
  <line x1="-20" y1="-24" x2="-20" y2="-32" stroke="#555" stroke-width="1.5"/>
  <line x1="20" y1="-24" x2="20" y2="-32" stroke="#555" stroke-width="1.5"/>
  <text x="0" y="42" class="label" font-weight="bold">OLT_001_NEW</text>
</g>

<!-- ==================== 第四层：底部设备 ==================== -->
<!-- 光分路器 -->
<g transform="translate(600, 600)">
  <polygon points="0,-14 -14,10 14,10" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="0" y="30" class="label-small">光分路器</text>
</g>

<!-- ONT家庭组网 -->
<g transform="translate(500, 680)">
  <rect x="-22" y="-16" width="44" height="32" rx="3" fill="#B2DFDB" stroke="#00796B" stroke-width="2"/>
  <text x="0" y="4" class="ont-label">ONT</text>
  <text x="0" y="30" class="label" font-size="10">家庭组网</text>
</g>

<!-- MDU政企用户 -->
<g transform="translate(700, 680)">
  <rect x="-22" y="-16" width="44" height="32" rx="3" fill="#B2DFDB" stroke="#00796B" stroke-width="2"/>
  <text x="0" y="4" class="mdu-label">MDU</text>
  <text x="0" y="30" class="label" font-size="10">政企用户</text>
</g>

<!-- ==================== 连线：黑色实线（现网链路） ==================== -->
<!-- Internet → CR1 -->
<line x1="440" y1="90" x2="410" y2="120" stroke="#333" stroke-width="2"/>
<!-- Internet → CR2 -->
<line x1="560" y1="90" x2="590" y2="120" stroke="#333" stroke-width="2"/>
<!-- CR1 — CR2 水平互联 -->
<line x1="428" y1="140" x2="572" y2="140" stroke="#333" stroke-width="2"/>

<!-- CR1 → BNG新垦旧站 -->
<line x1="400" y1="168" x2="260" y2="285" stroke="#333" stroke-width="2"/>
<!-- CR1 → BNG南沙2机房 -->
<line x1="420" y1="168" x2="590" y2="285" stroke="#333" stroke-width="2"/>
<!-- CR2 → BNG南沙2机房 -->
<line x1="580" y1="168" x2="610" y2="285" stroke="#333" stroke-width="2"/>
<!-- CR2 → BNG新垦新站 -->
<line x1="600" y1="168" x2="940" y2="285" stroke="#333" stroke-width="2"/>

<!-- 鱼窝头大道 → 光分路器 -->
<line x1="600" y1="514" x2="600" y2="586" stroke="#333" stroke-width="2"/>
<!-- 光分路器 → ONT -->
<line x1="590" y1="610" x2="515" y2="664" stroke="#333" stroke-width="2"/>
<!-- 光分路器 → MDU -->
<line x1="610" y1="610" x2="685" y2="664" stroke="#333" stroke-width="2"/>

<!-- ==================== 连线：红色实线+大X（废除链路） ==================== -->
<!-- OLT_001 上行0/10/0 → BNG新垦旧站 (左侧端口) -->
<line x1="220" y1="458" x2="240" y2="342" stroke="#E53935" stroke-width="2.5"/>
<!-- X on this line -->
<g transform="translate(230, 400)">
  <line x1="-6" y1="-6" x2="6" y2="6" stroke="#E53935" stroke-width="3"/>
  <line x1="6" y1="-6" x2="-6" y2="6" stroke="#E53935" stroke-width="3"/>
</g>

<!-- OLT_001 上行0/9/0 → BNG新垦旧站 (右侧端口) -->
<line x1="260" y1="458" x2="240" y2="342" stroke="#E53935" stroke-width="2.5"/>
<g transform="translate(250, 400)">
  <line x1="-6" y1="-6" x2="6" y2="6" stroke="#E53935" stroke-width="3"/>
  <line x1="6" y1="-6" x2="-6" y2="6" stroke="#E53935" stroke-width="3"/>
</g>

<!-- OLT_001 → 鱼窝头大道节点 -->
<line x1="268" y1="490" x2="582" y2="500" stroke="#E53935" stroke-width="2.5"/>
<g transform="translate(425, 496)">
  <line x1="-6" y1="-6" x2="6" y2="6" stroke="#E53935" stroke-width="3"/>
  <line x1="6" y1="-6" x2="-6" y2="6" stroke="#E53935" stroke-width="3"/>
</g>

<!-- BNG新垦旧站 → BNG新垦新站 (红色斜线，割接关系) -->
<line x1="272" y1="310" x2="928" y2="310" stroke="#E53935" stroke-width="2.5" stroke-dasharray="none"/>
<!-- Large X on the middle -->
<g transform="translate(600, 310)">
  <line x1="-10" y1="-10" x2="10" y2="10" stroke="#E53935" stroke-width="4"/>
  <line x1="10" y1="-10" x2="-10" y2="10" stroke="#E53935" stroke-width="4"/>
</g>
<text x="600" y="296" class="label" fill="#E53935" font-size="10" font-weight="bold">割接</text>

<!-- ==================== 连线：红色虚线（新建路径，带步骤编号） ==================== -->
<!-- BNG新垦旧站 → BNG南沙2机房 ① -->
<line x1="272" y1="325" x2="568" y2="325" stroke="#E53935" stroke-width="2" stroke-dasharray="6,4"/>
<circle cx="420" cy="310" r="12" fill="#E53935"/>
<text x="420" y="314" class="step-circle">①</text>

<!-- BNG南沙2机房 → BNG新垦新站 ② -->
<line x1="632" y1="325" x2="928" y2="325" stroke="#E53935" stroke-width="2" stroke-dasharray="6,4"/>
<circle cx="780" cy="310" r="12" fill="#E53935"/>
<text x="780" y="314" class="step-circle">②</text>

<!-- OLT_001_NEW 上行0/9/0 → BNG新垦新站 ③ -->
<path d="M940,458 Q940,400 960,342" stroke="#E53935" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
<circle cx="928" cy="400" r="12" fill="#E53935"/>
<text x="928" y="404" class="step-circle">③</text>

<!-- OLT_001_NEW 上行0/10/0 → BNG新垦新站 ④ -->
<path d="M980,458 Q980,400 960,342" stroke="#E53935" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
<circle cx="992" cy="400" r="12" fill="#E53935"/>
<text x="992" y="404" class="step-circle">④</text>

<!-- ==================== 蓝色粗箭头（割接方向） ==================== -->
<!-- 箭头1：位于①②路径旁 -->
<line x1="380" y1="350" x2="460" y2="350" stroke="#2196F3" stroke-width="4" marker-end="url(#blueArrow)"/>
<!-- 箭头2：位于③路径旁 -->
<line x1="890" y1="370" x2="920" y2="370" stroke="#2196F3" stroke-width="4" marker-end="url(#blueArrow)"/>
<!-- 箭头3：位于④路径旁 -->
<line x1="960" y1="440" x2="970" y2="410" stroke="#2196F3" stroke-width="4" marker-end="url(#blueArrow)"/>

<!-- ==================== 图例 ==================== -->
<g transform="translate(860, 720)">
  <rect x="-10" y="-22" width="310" height="160" rx="6" fill="#fff" stroke="#ccc" stroke-width="1" opacity="0.95"/>
  <text x="0" y="-4" class="legend-title">图 例</text>
  
  <!-- 废除链路 -->
  <line x1="0" y1="20" x2="60" y2="20" stroke="#E53935" stroke-width="2.5"/>
  <line x1="26" y1="14" x2="34" y2="26" stroke="#E53935" stroke-width="2"/>
  <line x1="34" y1="14" x2="26" y2="26" stroke="#E53935" stroke-width="2"/>
  <text x="75" y="24" class="legend-text">废除链路（红色实线+红色大X）</text>
  
  <!-- 新建路径 -->
  <line x1="0" y1="48" x2="60" y2="48" stroke="#E53935" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="30" cy="36" r="8" fill="#E53935"/>
  <text x="30" y="40" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">①</text>
  <text x="75" y="52" class="legend-text">新建路径（红色虚线+编号①②③④）</text>
  
  <!-- 割接方向 -->
  <line x1="0" y1="78" x2="60" y2="78" stroke="#2196F3" stroke-width="4" marker-end="url(#blueArrow)"/>
  <text x="75" y="82" class="legend-text">割接方向（蓝色粗箭头→）</text>
  
  <!-- 站点边界 -->
  <rect x="0" y="96" width="60" height="14" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="75" y="107" class="legend-text">站点边界（黑色虚线矩形框）</text>
  
  <!-- CR层容器 -->
  <ellipse cx="30" cy="125" rx="30" ry="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="75" y="129" class="legend-text">CR层容器（浅蓝色椭圆背景）</text>
</g>

</svg>