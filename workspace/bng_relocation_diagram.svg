<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <defs>
    <!-- 黑色箭头 -->
    <marker id="arrBlack" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1E293B"/>
    </marker>
    <!-- 蓝色粗箭头 -->
    <marker id="arrBlue" markerWidth="18" markerHeight="12" refX="16" refY="6" orient="auto">
      <polygon points="0 0, 18 6, 0 12" fill="#2563EB"/>
    </marker>
    <!-- 阴影 -->
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shLt" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1400" height="820" fill="#F8FAFC"/>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#E2E8F0" stroke-width="0.4"/>
  </pattern>
  <rect width="1400" height="820" fill="url(#grid)"/>

  <!-- 标题 -->
  <rect x="430" y="10" width="540" height="42" rx="21" fill="#0F172A" filter="url(#sh)"/>
  <text x="700" y="37" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">BNG 机房搬迁方案图</text>

  <!-- ================================================================ -->
  <!-- 站点虚线框                                                         -->
  <!-- ================================================================ -->
  <rect x="40" y="175" width="430" height="460" rx="10" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="10,5"/>
  <rect x="40" y="158" width="110" height="30" rx="6" fill="#64748B"/>
  <text x="95" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">新垦旧站</text>

  <rect x="930" y="175" width="430" height="460" rx="10" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="10,5"/>
  <rect x="930" y="158" width="110" height="30" rx="6" fill="#64748B"/>
  <text x="985" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">新垦新站</text>

  <!-- ================================================================ -->
  <!-- 第一层：OSS / Internet / CR1 / CR2                                -->
  <!-- ================================================================ -->

  <!-- OSS -->
  <g transform="translate(84, 58)">
    <circle cx="0" cy="-10" r="8" fill="#94A3B8"/>
    <path d="M -11 8 Q -11 -1 0 -3 Q 11 -1 11 8" fill="#94A3B8"/>
    <rect x="-9" y="13" width="18" height="22" rx="3" fill="#64748B"/>
    <rect x="-6" y="17" width="12" height="2.5" rx="1" fill="#CBD5E1"/>
    <rect x="-6" y="21" width="12" height="2.5" rx="1" fill="#CBD5E1"/>
    <rect x="-6" y="25" width="12" height="2.5" rx="1" fill="#CBD5E1"/>
    <circle cx="0" cy="19.5" r="1.5" fill="#22C55E"/>
    <text x="0" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#475569">OSS</text>
  </g>

  <!-- Internet -->
  <ellipse cx="700" cy="55" rx="82" ry="24" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" filter="url(#shLt)"/>
  <text x="700" y="61" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Internet</text>

  <!-- CR 容器（浅蓝椭圆背景） -->
  <ellipse cx="700" cy="130" rx="195" ry="54" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>

  <!-- CR1 -->
  <g transform="translate(582, 130)">
    <circle cx="0" cy="0" r="28" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#shLt)"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#FFFFFF" stroke-width="1.8"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1E3A5F">CR1</text>
  </g>

  <!-- CR2 -->
  <g transform="translate(818, 130)">
    <circle cx="0" cy="0" r="28" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#shLt)"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#FFFFFF" stroke-width="1.8"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1E3A5F">CR2</text>
  </g>

  <!-- ================================================================ -->
  <!-- 第二层：BNG 设备                                                   -->
  <!-- ================================================================ -->

  <!-- BNG新垦旧站 -->
  <g transform="translate(255, 288)">
    <circle cx="0" cy="0" r="34" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#sh)"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">M</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" font-weight="bold" fill="#1E3A5F">BNG(ME60)</text>
    <text x="0" y="68" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" font-weight="bold" fill="#1E3A5F">新垦旧站</text>
  </g>

  <!-- BNG南沙2机房 -->
  <g transform="translate(700, 288)">
    <circle cx="0" cy="0" r="34" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#sh)"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">S</text>
    <text x="0" y="11" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">M</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" font-weight="bold" fill="#1E3A5F">BNG(ME60:</text>
    <text x="0" y="68" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" font-weight="bold" fill="#1E3A5F">南沙2机房)</text>
  </g>

  <!-- BNG新垦新站 -->
  <g transform="translate(1145, 288)">
    <circle cx="0" cy="0" r="34" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#sh)"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">M</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" font-weight="bold" fill="#1E3A5F">BNG(ME60)</text>
    <text x="0" y="68" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" font-weight="bold" fill="#1E3A5F">新垦新站</text>
  </g>

  <!-- ================================================================ -->
  <!-- 第三层：OLT / 鱼窝头大道                                           -->
  <!-- ================================================================ -->

  <!-- OLT_001（旧站内） -->
  <g transform="translate(255, 458)">
    <rect x="-68" y="-28" width="136" height="56" rx="5" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#shLt)"/>
    <line x1="-45" y1="-15" x2="45" y2="-15" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="-8" x2="45" y2="-8" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="-1" x2="45" y2="-1" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="6" x2="45" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="13" x2="45" y2="13" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <!-- 上行端口 -->
    <rect x="-58" y="-34" width="11" height="7" rx="2" fill="#1E40AF"/>
    <text x="-52" y="-46" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#1E3A5F">上行0/10/0</text>
    <rect x="47" y="-34" width="11" height="7" rx="2" fill="#1E40AF"/>
    <text x="52" y="-46" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#1E3A5F">上行0/9/0</text>
    <text x="0" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">OLT_001</text>
  </g>

  <!-- 鱼窝头大道节点 -->
  <g transform="translate(700, 458)">
    <polygon points="0 -15, 16 12, -16 12" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#shLt)"/>
    <text x="0" y="30" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11" font-weight="bold" fill="#1E3A5F">至鱼窝头大道</text>
  </g>

  <!-- OLT_001_NEW（新站内） -->
  <g transform="translate(1145, 458)">
    <rect x="-68" y="-28" width="136" height="56" rx="5" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.5" filter="url(#shLt)"/>
    <line x1="-45" y1="-15" x2="45" y2="-15" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="-8" x2="45" y2="-8" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="-1" x2="45" y2="-1" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="6" x2="45" y2="6" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-45" y1="13" x2="45" y2="13" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
    <rect x="-58" y="-34" width="11" height="7" rx="2" fill="#1E40AF"/>
    <text x="-52" y="-46" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="9" fill="#1E3A5F">上行0/9/0</text>
    <rect x="47" y="-34" width="11" height="7" rx="2" fill="#1E40AF"/>
    <text x="52" y="-46" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="9" fill="#1E3A5F">上行0/10/0</text>
    <text x="0" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">OLT_001_NEW</text>
  </g>

  <!-- ================================================================ -->
  <!-- 第四层：光分路器 / ONT / MDU                                       -->
  <!-- ================================================================ -->

  <!-- 光分路器 -->
  <g transform="translate(700, 575)">
    <polygon points="0 -15, 16 12, -16 12" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2.2" filter="url(#shLt)"/>
  </g>

  <!-- ONT家庭组网 -->
  <g transform="translate(565, 640)">
    <rect x="-33" y="-16" width="66" height="32" rx="4" fill="#14B8A6" stroke="#0F766E" stroke-width="1.8" filter="url(#shLt)"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">ONT</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="9.5" fill="#0F766E" font-weight="bold">ONT家庭组网</text>
  </g>

  <!-- MDU政企用户 -->
  <g transform="translate(835, 640)">
    <rect x="-33" y="-16" width="66" height="32" rx="4" fill="#14B8A6" stroke="#0F766E" stroke-width="1.8" filter="url(#shLt)"/>
    <text x="0" y="-2" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">MDU</text>
    <text x="0" y="28" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="9.5" fill="#0F766E" font-weight="bold">MDU政企用户</text>
  </g>

  <!-- ================================================================ -->
  <!-- 黑色实线：现网链路                                                  -->
  <!-- ================================================================ -->
  <g fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Internet → CR1, CR2 -->
    <path d="M 630 74 Q 600 100 590 110"/>
    <path d="M 770 74 Q 800 100 810 110"/>

    <!-- CR1 — CR2 水平互联 -->
    <line x1="610" y1="130" x2="790" y2="130"/>

    <!-- CR1 → BNG新垦旧站（斜线） -->
    <line x1="582" y1="158" x2="255" y2="254"/>

    <!-- CR1 → BNG南沙2 -->
    <line x1="582" y1="158" x2="700" y2="254"/>

    <!-- CR2 → BNG南沙2 -->
    <line x1="818" y1="158" x2="700" y2="254"/>

    <!-- CR2 → BNG新垦新站（斜线） -->
    <line x1="818" y1="158" x2="1145" y2="254"/>

    <!-- 鱼窝头大道 → 光分路器 -->
    <line x1="700" y1="473" x2="700" y2="560"/>

    <!-- 光分路器 → ONT -->
    <path d="M 690 590 L 565 590 L 565 624"/>

    <!-- 光分路器 → MDU -->
    <path d="M 710 590 L 835 590 L 835 624"/>

  </g>

  <!-- ================================================================ -->
  <!-- 红色实线 + X：废除链路                                             -->
  <!-- ================================================================ -->

  <!-- BNG旧站 → OLT_001 上行0/10/0（L形，水平段放X） -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 240 322 L 203 322 L 203 424"/>
  </g>

  <!-- BNG旧站 → OLT_001 上行0/9/0（L形，水平段放X） -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 270 322 L 307 322 L 307 424"/>
  </g>

  <!-- OLT_001 → 鱼窝头大道（水平长线） -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round">
    <line x1="323" y1="458" x2="684" y2="458"/>
  </g>

  <!-- BNG旧站 → BNG新站 割接关系弧线（红色实线，无X） -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round">
    <path d="M 289 300 Q 700 372 1111 300"/>
  </g>

  <!-- ================================================================ -->
  <!-- 红色 X 标记                                                        -->
  <!-- ================================================================ -->
  <g stroke="#DC2626" stroke-width="3.5" stroke-linecap="round">
    <!-- X: BNG旧站→OLT上行0/10/0 路径上（水平段中间约 x=221, y=322） -->
    <line x1="213" y1="314" x2="229" y2="330"/>
    <line x1="229" y1="314" x2="213" y2="330"/>

    <!-- X: BNG旧站→OLT上行0/9/0 路径上（水平段中间约 x=289, y=322） -->
    <line x1="281" y1="314" x2="297" y2="330"/>
    <line x1="297" y1="314" x2="281" y2="330"/>

    <!-- X: OLT→鱼窝头大道 路径上（中间约 x=503, y=458） -->
    <line x1="495" y1="444" x2="511" y2="472"/>
    <line x1="511" y1="444" x2="495" y2="472"/>
  </g>

  <!-- 割接关系标签 -->
  <g transform="translate(700, 344)">
    <rect x="-24" y="-12" width="48" height="24" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" font-weight="bold" fill="#DC2626">割接</text>
  </g>

  <!-- ================================================================ -->
  <!-- 红色虚线：新建路径 + 编号圆圈                                       -->
  <!-- ================================================================ -->

  <!-- ① BNG旧站 → 南沙2 -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-dasharray="9,5" stroke-linecap="round">
    <line x1="283" y1="264" x2="672" y2="264"/>
  </g>

  <!-- ② 南沙2 → BNG新站 -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-dasharray="9,5" stroke-linecap="round">
    <line x1="728" y1="264" x2="1117" y2="264"/>
  </g>

  <!-- ③ OLT_NEW上行0/9/0 → BNG新站 -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-dasharray="9,5" stroke-linecap="round">
    <path d="M 1093 424 L 1100 390 L 1131 322"/>
  </g>

  <!-- ④ OLT_NEW上行0/10/0 → BNG新站 -->
  <g fill="none" stroke="#DC2626" stroke-width="2.8" stroke-dasharray="9,5" stroke-linecap="round">
    <path d="M 1197 424 L 1190 390 L 1159 322"/>
  </g>

  <!-- 步骤编号圆圈 -->
  <g>
    <circle cx="478" cy="264" r="15" fill="#DC2626" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="478" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">①</text>

    <circle cx="922" cy="264" r="15" fill="#DC2626" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="922" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">②</text>

    <circle cx="1100" cy="390" r="15" fill="#DC2626" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="1100" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">③</text>

    <circle cx="1190" cy="390" r="15" fill="#DC2626" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="1190" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">④</text>
  </g>

  <!-- ================================================================ -->
  <!-- 蓝色粗箭头：割接方向（3个）                                         -->
  <!-- ================================================================ -->
  <g fill="none" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round">
    <!-- 箭头1：①路径旁，BNG旧站→南沙2方向 -->
    <path d="M 345 250 L 435 250" marker-end="url(#arrBlue)"/>

    <!-- 箭头2：②路径旁，南沙2→BNG新站方向 -->
    <path d="M 855 250 L 905 250" marker-end="url(#arrBlue)"/>

    <!-- 箭头3：③路径旁，OLT搬迁方向（新站内，水平右指） -->
    <path d="M 1038 458 L 1095 458" marker-end="url(#arrBlue)"/>
  </g>

  <!-- ================================================================ -->
  <!-- 图例                                                              -->
  <!-- ================================================================ -->
  <g transform="translate(1040, 698)">
    <rect x="0" y="0" width="320" height="108" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shLt)"/>
    <text x="160" y="20" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="13" font-weight="bold" fill="#1E3A5F">图 例</text>

    <!-- 废除链路 -->
    <line x1="15" y1="38" x2="75" y2="38" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="40" y1="30" x2="50" y2="46" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="30" x2="40" y2="46" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="43" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" fill="#1E3A5F">废除链路（红色实线 + 大X）</text>

    <!-- 新建路径 -->
    <line x1="15" y1="64" x2="75" y2="64" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8,4"/>
    <circle cx="45" cy="64" r="8" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="45" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF">①</text>
    <text x="90" y="69" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" fill="#1E3A5F">新建路径（红色虚线 + 编号）</text>

    <!-- 割接方向 -->
    <line x1="15" y1="92" x2="60" y2="92" stroke="#2563EB" stroke-width="5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
    <text x="90" y="97" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="11.5" fill="#1E3A5F">割接方向（蓝色粗箭头）</text>
  </g>

  <!-- 页脚 -->
  <text x="700" y="812" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','SimHei',sans-serif" font-size="9.5" fill="#94A3B8">BNG 机房搬迁方案图（拓扑不变 · 利旧IP地址池 · 站点搬迁场景）</text>

</svg>