<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="inputBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="processBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="outputBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <!-- Excel 图标滤镜 -->
    <filter id="excelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    
    <!-- 箭头标记 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/>
    </marker>
    
    <marker id="arrowheadDown" markerWidth="10" markerHeight="7" refX="5" refY="9" orient="auto-start-reverse">
      <polygon points="0 0, 10 0, 5 10" fill="#0d9488"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="1400" height="700" fill="#f8fafc"/>
  
  <!-- 网格背景装饰 -->
  <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
  </pattern>
  <rect width="1400" height="620" fill="url(#gridPattern)"/>
  
  <!-- 标题区域 -->
  <path d="M 0 0 L 1400 0 L 1400 60 Q 700 75 0 60 Z" fill="url(#headerGrad)"/>
  <text x="700" y="35" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="white">华为 BNG 设备搬迁配置建议方案 - 工作流程图</text>
  <text x="700" y="55" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#e0f2fe">Huawei BNG Migration Configuration Recommendation Workflow</text>
  
  <!-- ==================== 左侧输入数据区 ==================== -->
  <g id="inputSection">
    <!-- 区域标签 -->
    <rect x="30" y="80" width="220" height="480" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="140" y="110" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">输入数据</text>
    
    <!-- 文件 1：原单板业务统计表 -->
    <g transform="translate(40, 140)">
      <rect width="200" height="100" rx="8" fill="url(#inputBoxGrad)" stroke="#0ea5e9" stroke-width="2" filter="url(#excelShadow)"/>
      <!-- Excel 图标 -->
      <rect x="10" y="12" width="40" height="40" rx="4" fill="#10b981"/>
      <text x="30" y="37" text-anchor="middle" font-family="Arial" font-size="20" fill="white">X</text>
      <line x1="10" y1="28" x2="50" y2="28" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
      <line x1="10" y1="36" x2="50" y2="36" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <!-- 文字 -->
      <text x="65" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">原单板业务统计表.xlsx</text>
      <text x="65" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#475569">(旧机房 A)</text>
      <text x="65" y="72" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#64748b">✓ 单板槽位信息</text>
      <text x="65" y="85" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#64748b">✓ 业务端口统计</text>
    </g>
    
    <!-- 连接箭头 -->
    <line x1="140" y1="240" x2="140" y2="255" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowheadDown)"/>
    
    <!-- 文件 2：端口规划表 -->
    <g transform="translate(40, 260)">
      <rect width="200" height="80" rx="8" fill="url(#inputBoxGrad)" stroke="#0ea5e9" stroke-width="2" filter="url(#excelShadow)"/>
      <!-- Excel 图标 -->
      <rect x="10" y="10" width="40" height="40" rx="4" fill="#3b82f6"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial" font-size="20" fill="white">S</text>
      <!-- 文字 -->
      <text x="65" y="30" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">端口规划表.xlsx</text>
      <text x="65" y="52" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#64748b">新机房端口映射关系</text>
    </g>
    
    <!-- 连接箭头 -->
    <line x1="140" y1="340" x2="140" y2="355" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowheadDown)"/>
    
    <!-- 文件 3：EOX/集采对照表 -->
    <g transform="translate(40, 365)">
      <rect width="200" height="90" rx="8" fill="url(#inputBoxGrad)" stroke="#0ea5e9" stroke-width="2" filter="url(#excelShadow)"/>
      <!-- Excel 图标 -->
      <rect x="10" y="8" width="40" height="40" rx="4" fill="#f59e0b"/>
      <text x="30" y="33" text-anchor="middle" font-family="Arial" font-size="20" fill="white">V</text>
      <!-- 文字 -->
      <text x="65" y="28" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">EOX/集采对照表.xlsx</text>
      <text x="65" y="48" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#64748b">设备生命周期 &amp; 替换规则</text>
      <text x="65" y="68" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#dc2626">⚠ EOX 识别关键</text>
    </g>
    
    <!-- 大箭头指向中间 -->
    <path d="M 260 320 L 300 320" stroke="url(#arrowGrad)" stroke-width="4" marker-end="url(#arrowhead)"/>
    <circle cx="270" cy="320" r="10" fill="#0d9488"/>
    <circle cx="290" cy="320" r="8" fill="#0d9488"/>
  </g>
  
  <!-- ==================== 中间处理逻辑区 ==================== -->
  <g id="processSection">
    <!-- 区域外框 -->
    <rect x="320" y="80" width="420" height="480" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="530" y="110" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d">处理逻辑流程</text>
    
    <!-- 步骤 1：剔除未使用槽位 -->
    <g transform="translate(340, 140)">
      <rect width="380" height="90" rx="10" fill="url(#processBoxGrad)" stroke="#16a34a" stroke-width="2.5"/>
      <!-- 序号圈 -->
      <circle cx="25" cy="25" r="18" fill="#ef4444"/>
      <text x="25" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">①</text>
      <!-- 主标题 -->
      <text x="60" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#166534">剔除未使用槽位</text>
      <!-- 说明 -->
      <text x="60" y="58" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#15803d">🗑️ 移除空槽位和未使用的单板</text>
      <text x="60" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#16a34a">→ 实现单板总数最小化</text>
      <!-- 高亮边框 -->
      <rect x="0" y="0" width="380" height="90" rx="10" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
    </g>
    
    <!-- 向下箭头 -->
    <g transform="translate(530, 235)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="#059669" stroke-width="4"/>
      <polygon points="-8,0 8,0 0,12" fill="#059669" transform="translate(0,28) rotate(90)"/>
    </g>
    
    <!-- 步骤 2：EOX 单板识别与替换 -->
    <g transform="translate(340, 275)">
      <rect width="380" height="100" rx="10" fill="url(#processBoxGrad)" stroke="#16a34a" stroke-width="2.5"/>
      <!-- 序号圈 -->
      <circle cx="25" cy="25" r="18" fill="#f97316"/>
      <text x="25" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">②</text>
      <!-- 主标题 -->
      <text x="60" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">EOX 单板识别与替换</text>
      <!-- 副标题 -->
      <text x="60" y="55" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#991b1b">⏰ EOX → 集采新型号 (1:1 替换)</text>
      <!-- 说明 -->
      <text x="60" y="75" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#15803d">参考《移动集采框架替换表》</text>
      <text x="60" y="90" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#16a34a">→ 确保兼容性和后续维护</text>
      <!-- 高亮边框 -->
      <rect x="0" y="0" width="380" height="100" rx="10" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3"/>
    </g>
    
    <!-- 向下箭头 -->
    <g transform="translate(530, 380)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="#059669" stroke-width="4"/>
      <polygon points="-8,0 8,0 0,12" fill="#059669" transform="translate(0,28) rotate(90)"/>
    </g>
    
    <!-- 步骤 3：合并优化单板布局 -->
    <g transform="translate(340, 420)">
      <rect width="380" height="90" rx="10" fill="url(#processBoxGrad)" stroke="#16a34a" stroke-width="2.5"/>
      <!-- 序号圈 -->
      <circle cx="25" cy="25" r="18" fill="#2563eb"/>
      <text x="25" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">③</text>
      <!-- 主标题 -->
      <text x="60" y="32" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="bold" fill="#166534">合并优化单板布局</text>
      <!-- 说明 -->
      <text x="60" y="58" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#15803d">🔧 同类型业务端口合并至同一单板</text>
      <text x="60" y="76" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#16a34a">→ 降低配置改动量，便于割接验证</text>
    </g>
    
    <!-- 核心原则标注框 -->
    <g transform="translate(350, 525)">
      <rect width="360" height="28" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
      <text x="180" y="19" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#15803d">★ ★ ★ ★ ★</text>
    </g>
  </g>
  
  <!-- ==================== 右侧输出结果区 ==================== -->
  <g id="outputSection">
    <!-- 区域标签 -->
    <rect x="760" y="80" width="260" height="280" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="890" y="110" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400e">输出结果</text>
    
    <!-- 大箭头从中间来 -->
    <line x1="750" y1="320" x2="760" y2="320" stroke="url(#arrowGrad)" stroke-width="4" marker-end="url(#arrowhead)"/>
    
    <!-- BNG HLD 配置建议表 -->
    <g transform="translate(780, 140)">
      <!-- 文档图标主体 -->
      <rect width="220" height="180" rx="8" fill="url(#outputBoxGrad)" stroke="#d97706" stroke-width="3"/>
      <!-- 文档顶部折角 -->
      <path d="M 180 0 L 220 0 L 220 40 L 180 40 Z" fill="#fcd34d"/>
      
      <!-- Excel 标识 -->
      <rect x="5" y="8" width="35" height="35" rx="3" fill="#fbbf24"/>
      <text x="22" y="33" text-anchor="middle" font-family="Arial" font-size="16" fill="#92400e">E</text>
      
      <!-- 表格模拟 -->
      <line x1="50" y1="55" x2="215" y2="55" stroke="#92400e" stroke-width="1.5"/>
      <rect x="50" y="55" width="60" height="25" fill="#fef9c3"/>
      <text x="80" y="71" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#854d0e">槽位</text>
      <rect x="110" y="55" width="50" height="25" fill="#fef9c3"/>
      <text x="135" y="71" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#854d">单板型号</text>
      <rect x="160" y="55" width="55" height="25" fill="#fef9c3"/>
      <text x="187" y="71" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#854d">端口数</text>
      
      <!-- 数据行示例 -->
      <line x1="50" y1="80" x2="215" y2="80" stroke="#fcd34d" stroke-width="1"/>
      <text x="55" y="95" font-family="Arial" font-size="10" fill="#78350f">10</text>
      <text x="115" y="95" font-family="Arial" font-size="10" fill="#78350f">HBAE1CSC</text>
      <text x="190" y="95" text-anchor="middle" font-family="Arial" font-size="10" fill="#78350f">96</text>
      
      <line x1="50" y1="105" x2="215" y2="105" stroke="#fcd34d" stroke-width="1"/>
      <text x="55" y="120" font-family="Arial" font-size="10" fill="#78350f">11</text>
      <text x="115" y="120" font-family="Arial" font-size="10" fill="#78350f">HBAE1GEB</text>
      <text x="190" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="#78350f">48</text>
      
      <line x1="50" y1="130" x2="215" y2="130" stroke="#fcd34d" stroke-width="1"/>
      <text x="55" y="145" font-family="Arial" font-size="10" fill="#78350f">12</text>
      <text x="115" y="145" font-family="Arial" font-size="10" fill="#78350f">HBAE1GEB</text>
      <text x="190" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#78350f">48</text>
      
      <!-- 标题文字 -->
      <text x="110" y="175" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#78350f">BNG HLD 配置建议表</text>
      <text x="110" y="195" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#92400e">└ 新机房 (B 机房)</text>
    </g>
    
    <!-- 成功标识 -->
    <g transform="translate(890, 330)">
      <circle cx="0" cy="0" r="25" fill="#22c55e"/>
      <path d="M -10 -2 L -2 6 L 12 -6" stroke="white" stroke-width="4" fill="none"/>
      <text x="35" y="5" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d">✅ 已优化</text>
    </g>
    
    <!-- 搬迁变更说明 -->
    <g transform="translate(780, 360)">
      <rect width="220" height="70" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="110" y="22" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">📝 搬迁变更说明</text>
      <text x="10" y="42" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#0c4a6e">• 原 A 机房槽位数量</text>
      <text x="10" y="58" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#0c4a6e">• 新 B 机房槽位数量</text>
      <text x="10" y="74" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#dc2626">• EOX 替换明细</text>
    </g>
  </g>
  
  <!-- ==================== 底部核心原则区 ==================== -->
  <g id="principlesSection">
    <rect x="100" y="580" width="1200" height="100" rx="12" fill="#0f766e"/>
    
    <!-- 原则标题 -->
    <text x="200" y="610" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="bold" fill="white">核心设计原则 Core Design Principles</text>
    
    <!-- 原则 1 -->
    <g transform="translate(220, 635)">
      <rect width="300" height="50" rx="6" fill="rgba(255,255,255,0.1)"/>
      <circle cx="15" cy="25" r="8" fill="#ef4444"/>
      <text x="15" y="29" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>
      <text x="35" y="27" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#fecaca">单板总数最小化</text>
      <text x="35" y="47" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#cbd5e1">Minimize total board count</text>
    </g>
    
    <!-- 原则 2 -->
    <g transform="translate(545, 635)">
      <rect width="320" height="50" rx="6" fill="rgba(255,255,255,0.1)"/>
      <circle cx="15" cy="25" r="8" fill="#f97316"/>
      <text x="15" y="29" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>
      <text x="35" y="27" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#fed7aa">EOX 单板 1:1 替换为集采新型号</text>
      <text x="35" y="47" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#cbd5e1">Replace EOX boards with procurement-approved models (1:1)</text>
    </g>
    
    <!-- 原则 3 -->
    <g transform="translate(890, 635)">
      <rect width="280" height="50" rx="6" fill="rgba(255,255,255,0.1)"/>
      <circle cx="15" cy="25" r="8" fill="#2563eb"/>
      <text x="15" y="29" text-anchor="middle" font-family="Arial" font-size="14" fill="white">✓</text>
      <text x="35" y="27" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#bfdbfe">配置改动最小化</text>
      <text x="35" y="47" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#cbd5e1">Minimize configuration changes</text>
    </g>
  </g>
  
  <!-- 左下角版本信息 -->
  <text x="20" y="685" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#94a3b8">Version 1.0 | Huawei BNG Migration Guide</text>
  
  <!-- 右下角 -->
  <text x="1380" y="685" text-anchor="end" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#94a3b8">IT/通信行业专用</text>
  
</svg>
